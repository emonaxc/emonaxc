<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="EMON AXC - Developer, Builder, Tech Enthusiast">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00C2FF"/>
      <stop offset="0.5" stop-color="#5B8DEF"/>
      <stop offset="1" stop-color="#8A2BE2"/>
    </linearGradient>
    <linearGradient id="ink" x1="240" y1="0" x2="960" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#9BE8FF"/>
      <stop offset="1" stop-color="#CBA8FF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="180" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00C2FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#8A2BE2" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blobA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00C2FF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#00C2FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8A2BE2" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8A2BE2" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="260"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="260" fill="#0D1117"/>
    <rect width="1200" height="260" fill="url(#grid)"/>

    <circle cx="130" cy="55" r="230" fill="url(#blobA)">
      <animate attributeName="cx" values="130;280;130" dur="15s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="55;125;55" dur="11s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1070" cy="215" r="250" fill="url(#blobB)">
      <animate attributeName="cx" values="1070;915;1070" dur="17s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="215;150;215" dur="13s" repeatCount="indefinite"/>
    </circle>

    <g opacity="0.5">
      <circle cx="230" cy="196" r="3" fill="#00C2FF">
        <animate attributeName="cy" values="196;120;196" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="420" cy="70" r="2" fill="#9BE8FF">
        <animate attributeName="cy" values="70;150;70" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.15;0.8;0.15" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="790" cy="60" r="2.5" fill="#CBA8FF">
        <animate attributeName="cy" values="60;170;60" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.15;0.85;0.15" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="980" cy="90" r="3" fill="#8A2BE2">
        <animate attributeName="cy" values="90;185;90" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle cx="600" cy="215" r="2" fill="#00C2FF">
        <animate attributeName="cy" values="215;95;215" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.7;0.1" dur="12s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect x="1" y="1" width="1198" height="258" rx="20" fill="none" stroke="url(#edge)" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.2;0.85;0.2" dur="6s" repeatCount="indefinite"/>
    </rect>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
      <text x="600" y="122" text-anchor="middle"
            font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
            font-size="74" font-weight="800" letter-spacing="8"
            fill="url(#ink)" filter="url(#soft)">EMON AXC</text>
    </g>

    <text x="600" y="164" text-anchor="middle" opacity="0"
          font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
          font-size="17" font-weight="600" letter-spacing="4.5" fill="#8FA3B8">
      DEVELOPER &#183; BUILDER &#183; TECH ENTHUSIAST
      <animate attributeName="opacity" values="0;1" dur="1s" begin="0.7s" fill="freeze"/>
    </text>

    <g transform="translate(600 186)">
      <rect x="-170" y="0" width="340" height="3" rx="1.5" fill="url(#edge)">
        <animate attributeName="opacity" values="0;1" dur="0.9s" begin="1s" fill="freeze"/>
      </rect>
      <rect x="-170" y="-0.5" width="120" height="4" rx="2" fill="url(#shine)" opacity="0.9">
        <animate attributeName="x" values="-170;50;50;-170" dur="4.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text x="600" y="222" text-anchor="middle" opacity="0"
          font-family="Fira Code, Consolas, monospace"
          font-size="13" letter-spacing="1.5" fill="#6E7F92">
      &lt;/&gt;  turning ideas into real-world projects
      <animate attributeName="opacity" values="0;1" dur="1s" begin="1.3s" fill="freeze"/>
    </text>

    <text x="1160" y="238" text-anchor="end"
          font-family="Fira Code, Consolas, monospace"
          font-size="12" fill="#4C5A6B">@emonaxc</text>
  </g>
</svg>
